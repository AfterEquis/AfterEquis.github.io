name: Update Steam games

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update-games:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Steam games
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
        run: node scripts/fetch-steam.mjs

      - name: Commit updated games
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add public/data/games.json
          if git diff --cached --quiet -- public/data/games.json; then
            echo "No changes to public/data/games.json"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update Steam games"
            git push
            gh workflow run deploy.yml
          fi
