name: Actualizar videos de YouTube

on:
  schedule:
    # Ejecutar todos los días a las 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-youtube:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ejecutar script de actualización de YouTube
        run: node scripts/fetch-youtube.js

      - name: Comprobar cambios y hacer commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/videos.json videos.json || true
          if git diff --staged --quiet; then
            echo "No hay nuevos vídeos de YouTube."
          else
            git commit -m "chore(youtube): actualizar videos.json diario [skip ci]"
            git push
          fi
